[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen
build_flags =
    ; === Skip TFT_eSPI default User_Setup.h ===
    -D USER_SETUP_LOADED
    ; === ILI9341 Display (safe GPIOs for ESP32-S3) ===
    -D ILI9341_DRIVER
    -D TFT_MOSI=16
    -D TFT_SCLK=18
    -D TFT_CS=4
    -D TFT_DC=5
    -D TFT_RST=6
    -D TFT_MISO=15
    ; === XPT2046 Touch (shared SPI bus) ===
    -D TOUCH_CS=7
    -D TOUCH_IRQ=17
    ; === Fonts ===
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D SMOOTH_FONT
    ; === SPI Frequency ===
    -D SPI_FREQUENCY=40000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; === ESP32-S3 specific ===
    -D USE_HSPI_PORT
    -D ARDUINO_USB_CDC_ON_BOOT=1
