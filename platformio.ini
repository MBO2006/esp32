; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	lvgl/lvgl@^9.2.0
	paulstoffregen/XPT2046_Touchscreen
	bodmer/JPEGDecoder
build_flags =
	; ===== TFT_eSPI 显示引脚 =====
	-D USER_SETUP_LOADED
	-D ILI9341_DRIVER
	-D TFT_ROTATION=0
	-D TFT_MOSI=16
	-D TFT_SCLK=18
	-D TFT_CS=4
	-D TFT_DC=5
	-D TFT_RST=6
	-D TFT_MISO=15
	-D TOUCH_CS=7
	-D TOUCH_IRQ=17
	-D LOAD_GLCD
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D SMOOTH_FONT
	-D SPI_FREQUENCY=40000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D USE_HSPI_PORT
	-D ARDUINO_USB_CDC_ON_BOOT=1
	; ===== PSRAM =====
	-D BOARD_HAS_PSRAM
	; ===== LVGL 配置 =====
	-D LV_CONF_PATH=\"lv_conf.h\"
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_USE_LOG=0
	-D LV_FONT_MONTSERRAT_8=0
	-D LV_FONT_MONTSERRAT_10=0
	-D LV_FONT_MONTSERRAT_12=0
	-D LV_FONT_MONTSERRAT_14=1
	-D LV_FONT_MONTSERRAT_16=1
	-D LV_FONT_MONTSERRAT_18=1
	-D LV_FONT_MONTSERRAT_20=1
	-D LV_FONT_MONTSERRAT_22=1
	-D LV_FONT_MONTSERRAT_24=1
	-D LV_FONT_MONTSERRAT_26=0
	-D LV_FONT_MONTSERRAT_28=1
	-D LV_FONT_MONTSERRAT_30=0
	-D LV_FONT_MONTSERRAT_32=1
	-D LV_FONT_MONTSERRAT_34=0
	-D LV_FONT_MONTSERRAT_36=0
	-D LV_FONT_MONTSERRAT_38=0
	-D LV_FONT_MONTSERRAT_40=1
	-D LV_FONT_MONTSERRAT_42=0
	-D LV_FONT_MONTSERRAT_44=1
	; ===== Include 路径（不要加 -Isrc，会跟系统 time.h 冲突）=====
	-Isrc/screens
